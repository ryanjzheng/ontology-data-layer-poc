[project]
name = "ontology-data-layer-poc"
version = "0.1.0"
description = "Palantir-style source/edit separation on Unity Catalog and Lakebase"
requires-python = ">=3.10"
dependencies = [
  "databricks-sdk>=0.81.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks rely on injected globals (dbutils, spark, display).
"src/core/setup_ontology.py" = ["F821"]
"src/core/apply_bridge.py" = ["F821"]
"src/demo/*.py" = ["F821"]
